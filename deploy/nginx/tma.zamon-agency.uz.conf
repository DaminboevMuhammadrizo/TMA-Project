# Host-level Nginx reverse proxy for the TMA Media Gallery Mini App.
# Place at /etc/nginx/sites-available/tma.zamon-agency.uz.conf on the VPS,
# symlink into sites-enabled, then run certbot (see backend/README or the
# root README's deploy section) to add HTTPS.
#
# - /api/*  -> backend container (docker-compose.prod.yml, host port 3010)
# - /*      -> frontend container (docker-compose.prod.yml, host port 8082)

server {
    listen 80;
    listen [::]:80;
    server_name tma.zamon-agency.uz;

    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media/file proxy responses can be large (audio/video) and are
        # meant to be cached long-term by the browser — don't buffer/limit
        # them tightly here.
        proxy_buffering off;
        client_max_body_size 100M;
    }

    location / {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
