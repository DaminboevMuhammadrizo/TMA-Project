version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tma
      POSTGRES_PASSWORD: tma
      POSTGRES_DB: tma_gallery
    ports:
      - "5432:5432"
    volumes:
      - tma_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: tma_backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://tma:tma@postgres:5432/tma_gallery
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: tma_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  tma_postgres_data:
