name: Deploy TMA Media Gallery to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 30m
          envs: BACKEND_ENV_FILE,VITE_API_BASE_URL
          script: |
            set -e
            echo "📁 Creating app folder..."
            mkdir -p /var/www/tma-gallery
            cd /var/www/tma-gallery

            if [ ! -d ".git" ]; then
              echo "📥 Cloning private repository..."
              git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/DaminboevMuhammadrizo/TMA-Project.git .
            else
              echo "♻️ Pulling latest code..."
              git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/DaminboevMuhammadrizo/TMA-Project.git
              git reset --hard
              git pull origin main
            fi

            echo "📝 Writing backend/.env from secret..."
            printf '%s\n' "$BACKEND_ENV_FILE" > backend/.env

            echo "🛑 Managing containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "🛠️ Building images..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "🗄️ Running Prisma migrations..."
            docker compose -f docker-compose.prod.yml run --rm backend npx -y prisma@5.20.0 migrate deploy

            echo "🚀 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "🧹 Cleaning up..."
            docker builder prune -f
            docker image prune -f

            echo "🎉 TMA Media Gallery deploy finished successfully!"
