services:
  redis:
    image: redis:7-alpine
    container_name: tma_redis
    restart: unless-stopped
    # Our own dedicated cache container on the compose network — NOT the
    # VPS's other prohome_redis. No persistence needed (pure cache), so no
    # volume. backend reaches it as redis://redis:6379 via Docker's
    # compose-network DNS (no extra_hosts needed, unlike postgres below).

  backend:
    build:
      context: ./backend
    container_name: tma_backend
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    extra_hosts:
      # Lets the container reach the VPS's existing prohome_postgres via its
      # host-published port (5432), regardless of which docker network it's on.
      - "host.docker.internal:host-gateway"
    ports:
      - "3010:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: tma_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"
